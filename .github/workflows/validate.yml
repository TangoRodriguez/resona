name: Validate RESONA

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read
  statuses: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mark production verification pending
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'production/resona',
              description: 'Building and waiting for Vercel production'
            })

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Verify production deployment
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for attempt in {1..18}; do
            html="$(curl -fsSL --max-time 20 https://resona-tango.vercel.app || true)"
            if grep -q "Live Merge" <<< "$html"; then
              echo "Production contains the Live Merge release."
              exit 0
            fi
            echo "Waiting for Vercel production deployment (${attempt}/18)..."
            sleep 10
          done
          echo "::error::Production did not expose the Live Merge release in time."
          exit 1

      - name: Mark production verification successful
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'production/resona',
              description: 'Live Merge release is available in production',
              target_url: 'https://resona-tango.vercel.app'
            })

      - name: Mark production verification failed
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'production/resona',
              description: 'Build or production smoke verification failed'
            })
